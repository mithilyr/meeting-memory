<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video card</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=block" rel="stylesheet">
<style>
  /* Title cards and callouts for the walkthrough video, in the app's catalist.media style.
     Rendered to PNG by render_cards.sh: card.html#card|KICKER|TITLE|LINE or card.html#callout|TEXT */
  :root { --ink: #0B0B0C; --yellow: #F8C020; --navy: #24408E; --paper: #F2EFE9; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body.card { background: var(--ink); color: var(--paper); font-family: Archivo, sans-serif; }
  body.callout { background: transparent; }
  .wrap { position: absolute; left: 160px; right: 160px; top: 50%; transform: translateY(-50%); }
  .kicker { font: 34px Anton, sans-serif; letter-spacing: 4px; color: var(--yellow); text-transform: uppercase; margin: 0 0 18px; }
  h1 { font: 170px/0.95 Anton, sans-serif; text-transform: uppercase; margin: 0; color: #fff; letter-spacing: 1px; }
  .bar { width: 220px; height: 14px; background: var(--yellow); margin: 44px 0 34px; }
  .line { font-size: 40px; color: #CFCAC0; max-width: 1400px; line-height: 1.35; margin: 0; }
  .tag { position: absolute; left: 160px; bottom: 80px; font: 26px Anton, sans-serif; letter-spacing: 3px; color: var(--yellow); }
  .box { position: absolute; left: 120px; bottom: 120px; background: var(--yellow); color: var(--ink);
         font: 56px Anton, sans-serif; text-transform: uppercase; letter-spacing: 1px; padding: 22px 40px;
         border: 4px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); max-width: 1500px; }
</style>
</head>
<body>
<script>
  const [kind, ...parts] = decodeURIComponent(location.hash.slice(1)).split("|");
  const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  document.body.className = kind;
  document.body.innerHTML = kind === "callout"
    ? `<div class="box">${esc(parts[0])}</div>`
    : `<div class="wrap"><p class="kicker">${esc(parts[0])}</p><h1>${esc(parts[1])}</h1>
       <div class="bar"></div><p class="line">${esc(parts[2] || "")}</p></div><div class="tag">MEETING MEMORY</div>`;
</script>
</body>
</html>
